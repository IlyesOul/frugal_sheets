name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp ui/* _site/
          cp sheet_api.py _site/
          if [ -f lab.py ]; then cp lab.py _site/lab.py; fi
          if [ -f llllab.py ]; then cp llllab.py _site/llllab.py; fi
          if [ ! -f _site/lab.py ] && [ -f llllab.py ]; then cp llllab.py _site/lab.py; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
